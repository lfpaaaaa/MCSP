<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Campus Companion sign-in code</title>
  </head>
  <body style="margin:0;background:#f4f7fb;font-family:Arial,sans-serif;color:#102a43;">
    <div style="max-width:520px;margin:40px auto;padding:32px;background:#ffffff;border-radius:8px;">
      <h1 style="margin:0 0 16px;font-size:24px;color:#0867b2;">Campus Companion</h1>
      <p style="margin:0 0 20px;line-height:1.5;">Enter this code in the app to finish signing in:</p>
      <p style="margin:0 0 20px;font-size:32px;font-weight:700;letter-spacing:6px;color:#102a43;">{{ .Token }}</p>
      <p style="margin:0;color:#627d98;line-height:1.5;">This code expires in 10 minutes. If you did not request it, you can ignore this email.</p>
    </div>
  </body>
</html>
