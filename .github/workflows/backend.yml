name: Backend

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/backend.yml"

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: Migrations and pgTAP tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Starting the local stack applies every migration from scratch; services the tests do
      # not need are left out to save time.
      - name: Start the local database
        run: supabase start -x studio,imgproxy,logflare,vector,edge-runtime,realtime,storage-api

      - name: Run the database tests
        run: supabase test db

      - name: Stop the local database
        if: always()
        run: supabase stop --no-backup

  functions:
    name: Edge Function type check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # The repository's package.json (for the Supabase CLI) would make Deno look for npm
      # packages in node_modules; the functions take theirs from Deno's own cache instead.
      - name: Type-check the Edge Functions
        run: |
          for function in supabase/functions/*/; do
            echo "::group::$function"
            deno check --node-modules-dir=none "$function"index.ts
            echo "::endgroup::"
          done
